<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Hatari WASM</title>
  <style>
    html,
    body,
    canvas {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    html,
    body {
      overflow: hidden;
      background-color: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      border: 0 none;
      background-color: #000;
      cursor: none;
      image-rendering: pixelated;
    }

    .fullscreen canvas {
      aspect-ratio: 4 / 3;
      width: 100%;
      height: auto;
      max-width: calc(100dvh * 4 / 3);
      max-height: 100dvh;
    }
  </style>
</head>

<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="832" height="588"></canvas>

  <script>
    var args = [
      "--desktop", "false",
      // "-d", "/share/hatari/fs/", // Set in hatari.js
      "--machine", "megaste",
      "--statusbar", "false",
      "--memsize", "4",
      "--cpuclock", "16",
    ];

    var Module = {
      preRun: [],
      postRun: [],
      canvas: document.getElementById("canvas"),
      totalDependencies: 0,

      print: (t) => console.log("[Hatari]", t),
      setStatus: (e) => console.log("[Hatari]", e),
      monitorRunDependencies: function (e) {
        (this.totalDependencies = Math.max(this.totalDependencies, e)),
          this.setStatus(e
            ? "Preparing... (" + (this.totalDependencies - e) + "/" + this.totalDependencies + ")"
            : "All downloads complete."
          );
      },

      // Accessors to prevent custom arguments being overwritten by Module["arguments"] in hatari.js (line 130-ish)
      get arguments() {
        return args;
      },
      set arguments(value) {
        for (let i = 0; i < value.length; i += 2) {
          if (args.indexOf(value[i]) === -1) {
            args.push(value[i], value[i + 1]);
          }
          console.log(args);
        }
      }
    };

    Module.setStatus("Downloading...");
    window.onerror = (e) => Module.setStatus("Error: " + e);

    // Apply letterbox/pillarbox when full screen/browser
    if (window.self !== window.top) {
      parent.document.addEventListener("fullscreenchange", event => {
        parent.document.fullscreenElement === window.frameElement
          ? document.documentElement.classList.add("fullscreen")
          : document.documentElement.classList.remove("fullscreen")
          ;
      });
    } else {
      document.documentElement.classList.add("fullscreen");
    }
  </script>
  <script async src="./hatari.js"></script>
</body>

</html>
